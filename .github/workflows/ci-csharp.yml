name: CI - C# .NET

on:
  pull_request:
    branches: [ main, master ]

jobs:
  run-csharp-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run .NET Tests
        run: dotnet test --logger "trx" || true

      - name: Normalize C# Test Report to Standard JSON
        run: |
          node -e '
            const fs = require("fs");
            const report = {
              stats: { failures: 1 },
              failures: [
                {
                  testName: "MyNamespace.MyTests.Test_FailureExample",
                  errorMessage: "Assert.AreEqual failed. Expected:<10>. Actual:<5>.",
                  stackTrace: "at MyNamespace.MyTests.Test_FailureExample() in C:\\tests\\MyTests.cs:line 25"
                }
              ]
            };
            fs.writeFileSync("test-results.json", JSON.stringify(report, null, 2));
          '

      - name: Run AI Failure Analyzer (CSharp)
        uses: ./
        with:
          report-path: 'test-results.json'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: 'google'
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}