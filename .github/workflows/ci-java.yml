name: CI - Java JUnit

on:
  workflow_dispatch: # Solo se ejecuta manualmente desde la pestaña "Actions" de GitHub
  #pull_request:
    #branches: [ main, master ]

jobs:
  run-java-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Normalize Java Test Report to Standard JSON
        run: |
          node -e '
            const fs = require("fs");
            // Estructura exacta que espera el JavaAdapter
            const report = {
              testsuites: [
                {
                  name: "com.example.AppTest",
                  testcase: [
                    {
                      name: "testExampleFailure",
                      classname: "com.example.AppTest",
                      failure: {
                        message: "java.lang.AssertionError: Expected true but got false",
                        stackTrace: "at com.example.AppTest.testExampleFailure(AppTest.java:18)"
                      }
                    }
                  ]
                }
              ]
            };
            fs.writeFileSync("test-results.json", JSON.stringify(report, null, 2));
            console.log("Reporte JSON para JavaAdapter generado exitosamente.");
          '

      - name: Run AI Failure Analyzer (Java)
        uses: ./
        with:
          report-path: 'test-results.json'
          framework: 'java'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: 'google'
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}